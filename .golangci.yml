version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  build-tags:
    - integration
    - e2e

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errchkjson
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - nilnesserr
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - unused
    - wastedassign
  settings:
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      confidence: 0.8
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: "SA1019:"
      - linters:
          - misspell
        text: "substituters"

formatters:
  enable:
    - gofmt
